[project]
name = "expense-tracker-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "firebase-admin>=6.5",
    # Supervised transaction classifier (Layer-2 of the categorization cascade).
    # Lazy-imported in cascade_categorizer.py so the app/tests still run if absent,
    # but required for the model layer to actually classify.
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
# PDF parsing for Zerodha holding statements. Installed in the venv; required
# only for the /sync/portfolio path (the parser imports them lazily so the rest
# of the app and the test suite run without them).
portfolio = [
    "pdfplumber>=0.11",
    "pypdf>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
